# Full run: all four FaithformBench-AF autoformalizers, every layer captured.
run_name: af_v1
models: [goedel, kimina, herald, stepfun]
device: cuda
dtype: bfloat16
collect:
  anchors: [prompt_last, step_last, step_mean]
  batch_size: 64
  layer_stride: 1
tasks: [proved, proved_strict, failing, sycophancy]
balance: [proved, perturbed_detect]   # tasks whose negatives are subsampled to the positive count
analysis:
  test_frac: 0.3             # fraction of *problems* held out
  val_frac: 0.2              # of the training problems, for layer selection
  seed: 0
  probe_C: 0.05
  layer_stride: 2            # probe every 2nd captured layer (+ the last)
  anchors: [prompt_last, step_mean]
  n_jobs: 8
  max_iter: 500
steer:
  anchor: prompt_last
  tasks: [proved, sycophancy, failing, proved_strict]
  directions: [dm, probe]    # dm = difference of class means (activation addition); probe = LR direction
  alphas: [-8, -4, -2, 2, 4, 8]   # in units of the class-mean distance |mean_pos - mean_neg|
  random_alphas: [-8, 8]
  n_per_class: 300
  max_new_tokens: 2048
  batch_size: 32
  positions: anchor_onward
  layer: null                # null = the validation-selected layer
heads:                       # attention-head probes (collect-heads / probe-heads), ITI-style
  anchors: [prompt_last, step_mean]
  batch_size: 64
  layer_stride: 1
  top_k: [1, 4, 16, 64]
  head_probe_C: 1.0          # per-head probes are 128-dimensional; weaker regularisation than the d-dim probes
  steer_k: 16                # heads steered by steer-heads (top-k by validation AUROC at the prompt_last anchor)
  steer_alphas: [-32, -16, -8, 8, 16, 32]   # per head, in units of that head's class-mean distance (|dm_h| ~ 0.1-1.3 vs head norms 3-15)
  steer_random_alphas: [-32, 32]
tf:                          # teacher-forced anchors on the unperturbed half (collect-tf / probe-tf)
  anchors: [output_last, statement_last, statement_mean]
  batch_size: 16
  layer_stride: 1
  max_output_tokens: 3072
  tasks: [proved_unp, failing_unp]
modernbert:                  # text-only classifier baseline (same split as the probes)
  epochs: 3
  batch_size: 32
  lr: 3.0e-5
  max_length: 160
prove:                       # DeepSeek-Prover-V2 over the steered generations (prove-gen needs vLLM)
  tasks: [proved, sycophancy]
  conditions: {dm: [-8, -4, -2, 2, 4, 8], probe: [-8, 8], random: [-8, 8]}   # alpha 0 is always included
  n_samples: 2               # proof samples per statement and per negation (the benchmark used 2)
  max_tokens: 4096
  max_model_len: 8192
  gpu_memory_utilization: 0.3
  gen_batch: 256
  lean_workers: 48
  lean_batch: 8
variants:                    # steering coverage (steer-variant --variant <name>); 150 steps per class, base rows reused
  layer_sweep: {kind: resid, layer_quantiles: [0.5, 0.75, 1.0], alphas: [-8, 8], random_alphas: [8]}
  multi_layer: {kind: resid_multi, layer_step: 2, alphas: [-4, 4], random_alphas: [4]}
  cot_only: {kind: resid, layer_quantiles: [], positions: generated, alphas: [-8, 8], random_alphas: [8]}
  heads_sigma: {kind: heads, k: 16, unit: proj_std, alphas: [-15, 15], random_alphas: [15]}
  ablate: {kind: project, targets: [mean, pos_mean, neg_mean], random: true}
relabel:                     # prover-robustness: relabel held-out benchmark statements with a second prover
  prover: goedel             # Goedel-LM/Goedel-Prover-V2-8B
  per_model: 1500
  n_samples: 1
  max_tokens: 8192
  max_model_len: 12288
lean:
  enabled: true              # type-check generated statements against the Mathlib below (TC-Fail proxy)
  project_dir: /scratch/datasets/lean-stockfish/mathlib   # built Mathlib, toolchain v4.33.1 installed
  timeout: 900
  batch: 40
